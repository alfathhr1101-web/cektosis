<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance</title>

<style>
body {
    margin: 0;
    padding: 0;
    background: #0f172a;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

.container {
    max-width: 600px;
    padding: 20px;
}

h1 {
    font-size: 40px;
}

p {
    color: #cbd5e1;
    font-size: 16px;
    line-height: 1.6;
}

.spinner {
    margin: 25px auto;
    width: 60px;
    height: 60px;
    border: 6px solid #334155;
    border-top: 6px solid #38bdf8;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    100% { transform: rotate(360deg); }
}

.contact {
    margin-top: 25px;
    padding: 15px;
    background: #1e293b;
    border-radius: 10px;
}

a.button {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 15px;
    border-radius: 8px;
    text-decoration: none;
    color: white;
    background: #22c55e;
}

a.email {
    background: #3b82f6;
}
</style>

</head>

<body>

<div class="container">

    <h1>🚧 Maintenance Mode</h1>

    <div class="spinner"></div>

    <p>
        Website sedang dalam perbaikan sistem.<br>
        Kami sedang meningkatkan performa dan keamanan.
    </p>

    <p>Mohon kembali beberapa saat lagi.</p>

    <!-- CONTACT PERSON -->
    <div class="contact">
        <p><b>Contact Person</b></p>

        <p>Admin Cektosis</p>

        <a class="button" href="https://wa.me/855765772633" target="_blank">
            💬 WhatsApp
        </a>

    </div>

</div>

</body>
</html>
