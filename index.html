<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .spinner {
            margin: 30px auto;
            width: 60px;
            height: 60px;
            border: 6px solid #334155;
            border-top: 6px solid #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🚧 Maintenance Mode</h1>

        <div class="spinner"></div>

        <p>
            Website sedang dalam proses maintenance.<br>
            Kami sedang melakukan peningkatan sistem agar lebih cepat dan stabil.
        </p>

        <p>
            Mohon kembali beberapa saat lagi.
        </p>

        <div class="footer">
            © 2026 Cektosis System
        </div>
    </div>

</body>
</html>
