<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0f172a;
    color:#e5e7eb;
}

/* container */
.container{
    text-align:center;
    max-width:520px;
    padding:30px;
}

/* icon */
.icon{
    font-size:50px;
    margin-bottom:15px;
}

/* title */
h1{
    font-size:26px;
    margin-bottom:10px;
    font-weight:600;
}

/* text */
p{
    font-size:14px;
    color:#94a3b8;
    line-height:1.6;
}

/* small info */
.small{
    margin-top:12px;
    font-size:12px;
    color:#64748b;
}

/* button */
a{
    display:inline-block;
    margin-top:20px;
    padding:10px 18px;
    border-radius:8px;
    text-decoration:none;
    color:white;
    background:#22c55e;
    font-size:13px;
}

a:hover{
    opacity:0.9;
}
.logo{
    width:115px;
    margin-bottom:18px;
    animation: float 3s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(56,189,248,0.3));
}
</style>

</head>

<body>

<div class="container">

    <img src="assets/logo.png" class="logo">

    <div class="icon">🚧🚧🚧🚧🚧</div>

    <h1>Website Sedang Maintenance</h1>

    <p>
        Kami sedang melakukan perbaikan sistem untuk meningkatkan performa dan keamanan website.
    </p>

    <p class="small">
        Mohon kembali beberapa saat lagi.
    </p>

    <a href="https://wa.me/855765772633" target="_blank">
        Hubungi developer
    </a>

</div>
<div id="goalOverlay" class="goal-overlay">
    <div class="goal-text">GOAL! ⚽🔥</div>
</div>
</body>
</html>
